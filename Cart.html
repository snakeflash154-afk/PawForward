<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawForward | Your Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header-mount"></div>
<script src="layout.js"></script>

<section class="page-banner">
    <h1><span>Your cart</span></h1>
    <p>Every purchase in our shop goes toward food and care for rescued animals.</p>
</section>

<section class="container">
    <div class="cart-layout" id="cartLayout">
        <div class="cart-list" id="cartList"></div>

        <aside class="summary">
            <h2>Order summary</h2>
            <div class="summary-row"><span>Subtotal</span><span id="subtotal"></span></div>
            <div class="summary-row"><span>Shipping</span><span id="shipping"></span></div>
            <p class="summary-note" id="shipNote"></p>
            <div class="summary-row total"><span>Total</span><span id="total"></span></div>
            <button type="button" class="donate-now" id="checkoutBtn">Checkout</button>
            <p class="thanks" id="checkoutNote" role="status"></p>
            <p class="summary-note" style="margin-top:14px"><a href="shop.html" style="color:var(--red);font-weight:700">Continue shopping</a></p>
        </aside>
    </div>

    <div class="cart-empty" id="cartEmpty" hidden>
        <h2>Your cart is empty</h2>
        <p>Find something for your pet and support our rescues at the same time.</p>
        <a href="shop.html" class="btn">Browse the shop</a>
    </div>
</section>
<div id="footer-placeholder"></div>
<script src="core.js"></script>
<script src="script.js"></script>
<script src="cart.js"></script>
</body>
</html>
