<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawForward | Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header-mount"></div>
<script src="layout.js"></script>

<section class="page-banner">
    <h1><span>Shop</span></h1>
    <p>Every purchase pays for food and vet care for rescued animals.</p>
</section>

<section class="shop-wrap">
<div class="container">
    <div class="perks">
        <div class="perk">
            <span class="perk-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/></svg></span>
            <div><strong>Free shipping</strong><span>On orders over &#8369;1,000</span></div>
        </div>
        <div class="perk">
            <span class="perk-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></span>
            <div><strong>Funds rescues</strong><span>Proceeds go to animal care</span></div>
        </div>
        <div class="perk">
            <span class="perk-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span>
            <div><strong>Easy payments</strong><span>GCash, Maya, bank or card</span></div>
        </div>
    </div>

    <div class="shop-toolbar">
        <div class="chips" id="chips" role="group" aria-label="Filter products">
            <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="chip" data-filter="pets" aria-pressed="false">For pets</button>
            <button type="button" class="chip" data-filter="merch" aria-pressed="false">Merch</button>
        </div>
        <label class="sort"><span>Sort by</span>
            <select id="sort">
                <option value="featured">Featured</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
                <option value="name">Name</option>
            </select>
        </label>
    </div>
    <p class="result-count" id="shopCount" aria-live="polite"></p>

    <div class="shop-grid" id="shopGrid"></div>
</div>
</section>

<div id="footer-placeholder"></div>
<script src="core.js"></script>
<script src="script.js"></script>
<script src="cart.js"></script>
<script>
    // Sample products. Replace with your real ones (later this list will come from the back end).
    // Photos go in images/shop-<id>.jpg
    const PRODUCTS = [
        { id: "leash", name: "Dog leash",           cat: "pets",  price: 350, desc: "Strong, soft-grip nylon leash. 1.5 m." },
        { id: "bowl",  name: "Pet food bowl",       cat: "pets",  price: 220, desc: "Non-slip stainless steel bowl." },
        { id: "toy",   name: "Cat toy set",         cat: "pets",  price: 180, desc: "Five toys to keep curious cats busy." },
        { id: "tote",  name: "Rescue paw tote bag", cat: "merch", price: 480, desc: "Sturdy canvas tote with our paw print.", badge: "Best seller" },
        { id: "tee",   name: "PawForward T-shirt",  cat: "merch", price: 650, desc: "Soft cotton tee. Wear your support.", badge: "New" },
        { id: "mug",   name: "Ceramic mug",         cat: "merch", price: 320, desc: "For coffee with a good cause." }
    ];
    const CAT_LABEL = { pets: "For pets", merch: "Merch" };
    const peso = (n) => "\u20B1" + n.toLocaleString("en-US");
    const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

    const state = { filter: "all", sort: "featured" };
    const grid = document.getElementById("shopGrid");

    function renderProducts() {
        let list = PRODUCTS.filter((p) => state.filter === "all" || p.cat === state.filter);
        if (state.sort === "low") list = list.slice().sort((a, b) => a.price - b.price);
        if (state.sort === "high") list = list.slice().sort((a, b) => b.price - a.price);
        if (state.sort === "name") list = list.slice().sort((a, b) => a.name.localeCompare(b.name));

        grid.innerHTML = "";
        list.forEach((p, i) => {
            const card = document.createElement("article");
            card.className = "item-card";
            card.dataset.cat = p.cat;
            card.style.setProperty("--i", i);
            card.innerHTML =
                '<div class="item-img ph"><img loading="lazy" onerror="this.remove()"><span class="tag"></span></div>' +
                '<div class="item-body"><h3></h3><p class="desc"></p>' +
                '<div class="buy-row"><span class="price"></span><button type="button" class="add-to-cart">' + PLUS + 'Add to cart</button></div></div>';
            const img = card.querySelector("img");
            img.src = "images/shop-" + p.id + ".jpg"; img.alt = p.name;
            card.querySelector(".tag").textContent = CAT_LABEL[p.cat];
            if (p.badge) { const f = document.createElement("span"); f.className = "flag"; f.textContent = p.badge; card.querySelector(".item-img").appendChild(f); }
            card.querySelector("h3").textContent = p.name;
            card.querySelector(".desc").textContent = p.desc;
            card.querySelector(".price").textContent = peso(p.price);
            const btn = card.querySelector(".add-to-cart");
            btn.dataset.id = p.id; btn.dataset.name = p.name; btn.dataset.price = p.price; btn.dataset.img = "images/shop-" + p.id + ".jpg";
            btn.setAttribute("aria-label", "Add " + p.name + " to cart");
            grid.appendChild(card);
        });
        document.getElementById("shopCount").textContent = "Showing " + list.length + " of " + PRODUCTS.length + " products";
    }

    document.getElementById("chips").addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (!chip) return;
        document.querySelectorAll("#chips .chip").forEach((c) => c.setAttribute("aria-pressed", c === chip));
        state.filter = chip.dataset.filter;
        renderProducts();
    });
    document.getElementById("sort").addEventListener("change", (e) => { state.sort = e.target.value; renderProducts(); });
    renderProducts();
</script>
</body>
</html>
