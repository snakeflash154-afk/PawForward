<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawForward Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
    <script src="../core.js"></script>
    <script src="popup.js" defer></script>
</head>
<body>
    <div class="popup-overlay" id="overlay">
        <div class="popup-container" role="dialog" aria-modal="true" aria-labelledby="popTitle">
            <button type="button" class="close-button" id="closeBtn" aria-label="Close">&times;</button>

            <p class="notice" id="notice" role="status" hidden></p>

            <section id="signInSection">
                <h2 id="popTitle">Welcome to PawForward</h2>
                <p>Sign in to your account</p>
                <form id="signInForm" novalidate>
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>

                    <p class="form-error" id="signInError" role="alert" hidden></p>
                    <button type="submit">Sign in</button>
                </form>
                <p class="switch">Don't have an account? <a href="#" id="showSignUp">Sign up</a></p>
            </section>

            <section id="signUpSection" hidden>
                <h2>Create an account</h2>
                <p>Join the PawForward community</p>
                <form id="signUpForm" novalidate>
                    <label for="fName">First name</label>
                    <input type="text" id="fName" placeholder="Enter your first name" autocomplete="given-name" required>

                    <label for="lName">Last name</label>
                    <input type="text" id="lName" placeholder="Enter your last name" autocomplete="family-name" required>

                    <label for="dob">Date of birth</label>
                    <input type="date" id="dob" autocomplete="bday" required>

                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="Enter your city" autocomplete="address-level2" required>

                    <label for="signUpEmail">Email address</label>
                    <input type="email" id="signUpEmail" placeholder="Enter your email" autocomplete="email" required>

                    <label for="signUpPassword">Password</label>
                    <input type="password" id="signUpPassword" placeholder="At least 8 characters" autocomplete="new-password" required>

                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required>

                    <p class="form-error" id="signUpError" role="alert" hidden></p>
                    <button type="submit">Create account</button>
                </form>
                <p class="switch">Already have an account? <a href="#" id="showSignIn">Sign in</a></p>
            </section>
        </div>
    </div>
</body>
</html>
