<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawForward Account</title>

    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>
<body>
    <div class="popup-overlay">
        <div class="popup-container">
            <button type="button" class="close-button">&times;</button>

            <h2>Welcome to PawForward</h2>
            <p >Sign in to your account</p>

            <form id="signInForm">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your Email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your Password" required>

                <button type="submit">Sign In</button>
            </form>

            <p>Don't Have an Account? <a href="#" id="showSignUp">Sign Up</a></p>

            <div id="signUpSection" style="display: none;">
                <h2>Create an Account</h2>
                <p>Join the PawForward community</p>

                <form id="signUpForm">
                    <label for="fName">First Name</label>
                    <input type="text" id="fName" name="fName" placeholder="Enter your First Name" required>

                    <label for="lName">Last Name</label>
                    <input type="text" id="lName" name="lName" placeholder="Enter your Last Name" required>

                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>

                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="Enter your City" required>

                    <label for="signUpEmail">Email Address</label>
                    <input type="email" id="signUpEmail" name="signUpEmail" placeholder="Enter your Email" required>
                    
                    <label for="signUpPassword">Password</label>
                    <input type="password" id="signUpPassword" name="signUpPassword" placeholder="Create a Password" required>

                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your Password" required>

                    <button type="submit">Sign Up</button>
                </form>

                <p>Already have an Account? <a href="#" id="showSignIn">Sign In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
